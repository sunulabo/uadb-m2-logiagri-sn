
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logi-Agri SN</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="tb-brand">
    <div class="tb-logo">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="tb-title">Logi-Agri SN</span>
    <span class="tb-sub">v2</span>
  </div>
  <div class="tb-divider"></div>
  <span class="tb-crumb">
    Logistique Agricole / <strong id="bc-label">Dashboard</strong>
  </span>
  <div class="tb-right">
    <div class="tb-live">
      <div class="live-dot"></div> Spark Streaming actif
    </div>
    <div class="tb-alerts-btn">
      ⚠ <span id="nb-critiques">0</span> alertes CRITIQUE
    </div>
    <div class="tb-avatar">SN</div>
  </div>
</div>

<!-- BODY -->
<div id="app-body">

  <!-- SIDEBAR -->
  <div id="sidebar">

    <div class="sb-section">Monitoring</div>
    <a href="/" class="sb-item {% if request.path == '/' %}on{% endif %}">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      Temps Réel
      <span class="sb-badge" style="color:#6ee7b7">●</span>
    </a>
    <a href="/kpis" class="sb-item {% if request.path == '/kpis' %}on{% endif %}">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      KPI Analytiques
      <span class="sb-badge">30j</span>
    </a>

    <div class="sb-sep"></div>
    <div class="sb-section">Intelligence</div>
    <a href="/ml" class="sb-item {% if request.path == '/ml' %}on{% endif %}">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18"/>
      </svg>
      Modèle ML
      <span class="sb-badge">RF</span>
    </a>
    <a href="/optimisation" class="sb-item {% if request.path == '/optimisation' %}on{% endif %}">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
      </svg>
      Optimisation
      <span class="sb-badge">LP</span>
    </a>

    <div class="sb-sep"></div>
    <div class="sb-section">Système</div>
    <a href="/infrastructure" class="sb-item {% if request.path == '/infrastructure' %}on{% endif %}">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M5 12H3m18 0h-2M12 5V3m0 18v-2M7.05 7.05L5.636 5.636m12.728 12.728L16.95 16.95"/>
      </svg>
      Infrastructure
      <span class="sb-badge">7</span>
    </a>

    <div class="sb-bottom">
      <a href="/parametres" class="sb-item {% if request.path == '/parametres' %}on{% endif %}">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Paramètres
      </a>
    </div>

  </div>

  <!-- CONTENU -->
  <div id="main">
    {% block content %}{% endblock %}
  </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
