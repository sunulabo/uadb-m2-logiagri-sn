x-airflow-common: &airflow-common
  image: apache/airflow:2.7.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd5gE="
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    LOGI_SECRET_SALT: "logi_agri_sn_2025_uadb_secret"
    MLFLOW_TRACKING_URI: "http://mlflow:5000" 
  volumes:
    - ./dags:/opt/airflow/dags
    - ./models:/opt/airflow/models
    - ./logs/airflow:/opt/airflow/logs
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── ZooKeeper ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: logi_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [logi_net]
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/log/zookeeper

  # ── Kafka ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: logi_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_JMX_PORT: 9101
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [logi_net]

  # ── Kafka UI (bonus UX) ──────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: logi_kafka_ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logi-agri-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on: [kafka]
    networks: [logi_net]

  # ── Apache NiFi ──────────────────────────────────────────
  nifi:
    image: apache/nifi:1.23.2
    container_name: logi_nifi
    ports:
      - "8081:8080"
    environment:
      NIFI_WEB_HTTP_PORT: "8080"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: logiagri2025!
    volumes:
      - ./nifi_templates:/opt/nifi/nifi-current/conf/templates
      - nifi_data:/opt/nifi/nifi-current/data
    networks: [logi_net]

  # ── HBase ────────────────────────────────────────────────
  hbase:
    image: dajobe/hbase:latest
    container_name: logi_hbase
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "9090:9090"   # Thrift
      - "9095:9095"   # Thrift UI
    environment:
      HBASE_CONF_hbase_zookeeper_quorum: zookeeper
    depends_on: [zookeeper]
    healthcheck:
      test: ["CMD", "hbase", "status"]
      interval: 30s
      timeout: 15s
      retries: 10
    networks: [logi_net]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ── Hive Metastore ───────────────────────────────────────
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: logi_hive
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: "hiveserver2"
      DB_DRIVER: derby
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
    networks: [logi_net]

  # ── Spark Master ─────────────────────────────────--------
  spark-master:
    image: public.ecr.aws/bitnami/spark:latest
    container_name: logi_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_MASTER_MEMORY: "2g"
    volumes:
      - ./:/opt/app
      - spark_logs:/opt/bitnami/spark/logs
    networks: [logi_net]

  # ── Spark Worker ─────────────────────────────────--------
  spark-worker:
    image: bitnami/spark:latest
    container_name: logi_spark_worker
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./:/opt/app
    networks: [logi_net]

  # ── PostgreSQL (Airflow + MLflow) ─────────────────────────
  postgres:
    image: postgres:15
    container_name: logi_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_mlflow_db.sql:/docker-entrypoint-initdb.d/init_mlflow_db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [logi_net]

  # ── Airflow Init ─────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: logi_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create --username admin --firstname Cheikh --lastname KA \
          --role Admin --email kheuch0912@gmail.com --password logiagri2025
    restart: "no"

  # ── Airflow Webserver ────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: logi_airflow_web
    ports:
      - "8082:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [logi_net]

  # ── Airflow Scheduler ────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: logi_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [logi_net]

  # ── MLflow (BONUS — traçabilité ML) ──────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: logi_mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://airflow:airflow@postgres/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks: [logi_net]

  # ── Grafana (BONUS — dashboards live) ────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: logi_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: logiagri2025
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-kafka-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks: [logi_net]

  # ── Prometheus (métriques pipeline) ──────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: logi_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks: [logi_net]

volumes:
  nifi_data:
  hive_warehouse:
  spark_logs:
  postgres_data:
  mlflow_artifacts:
  grafana_data:
  prometheus_data:
  zookeeper_data:
  zookeeper_log:

networks:
  logi_net:
    driver: bridge
    name: logi_agri_network
