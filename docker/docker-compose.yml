services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - logi_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - logi_net

  nifi:
    image: apache/nifi:1.25.0  # FIX: tag spécifique au lieu de latest
    container_name: nifi
    ports:
      - "8081:8080"  # FIX: changé de 8443 à 8081 (conflit avec spark)
    environment:
      NIFI_WEB_HTTP_PORT: 8080
    networks:
      - logi_net

  hbase:
    image: harisekhon/hbase:2.1
    container_name: hbase
    ports:
      - "16010:16010"
      - "19090:9090"  # FIX: changé de 9090 à 19090 (conflit avec prometheus/autres services)
    networks:
      - logi_net

  hive-metastore:
    image: apache/hive:4.0.0  # FIX: 3.1.3 n'existe pas, remplacé par 4.0.0
    container_name: hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
    networks:
      - logi_net

  hiveserver2:
    image: apache/hive:4.0.0  # FIX: aligné avec hive-metastore
    container_name: hiveserver2
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
    networks:
      - logi_net

  spark-master:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu  # FIX: tag spécifique au lieu de latest
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - logi_net

  spark-worker:
    image: apache/spark:4.0.2-scala2.13-java17-python3-r-ubuntu  # FIX: aligné avec spark-master
    container_name: spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - logi_net

  airflow:
    image: apache/airflow:2.7.3
    container_name: airflow
    ports:
      - "8082:8080"
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd5gE="
    volumes:
      - ./dags:/opt/airflow/dags
      - ./models:/opt/airflow/models
    networks:
      - logi_net

 
 

networks:
  logi_net:
    driver: bridge