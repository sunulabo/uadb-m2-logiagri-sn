services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  nifi:
    image: apache/nifi:1.23.2
    container_name: nifi
    ports:
      - "8081:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080

  hbase:
    image: harisekhon/hbase:2.1
    platform: linux/amd64   # ← ajouter
    container_name: hbase
    ports:
      - "16010:16010"
      - "9090:9090"

  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64   # ← ajouter
    container_name: hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore

  hiveserver2:
    image: apache/hive:3.1.3
    platform: linux/amd64   # ← ajouter
    container_name: hiveserver2
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  airflow:
    image: apache/airflow:2.7.3
    container_name: airflow
    ports:
      - "8082:8080"
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./models:/opt/airflow/models

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: logiagri
      POSTGRES_PASSWORD: logiagri2025
      POSTGRES_DB: logiagri_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init_grafana_db.sql:/docker-entrypoint-initdb.d/01-init-grafana-db.sql:ro

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    depends_on:
      - postgres
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: logiagri2025
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
